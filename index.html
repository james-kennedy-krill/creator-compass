<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11182a">
  <meta name="description" content="Creator Compass: an interactive digital safety course for teen creators and their families.">
  <title>Creator Compass — Make art. Keep your agency.</title>
  <style>
    :root { --ink:#172038; --muted:#647087; --paper:#f6f6f2; --white:#fff; --navy:#121b31; --lime:#d8ff69; --lilac:#e4dafd; --coral:#ff8c78; --line:#e5e8e8; --teal:#136e61; --soft:#eff3ec; --shadow:0 18px 52px rgba(20,29,49,.08); }
    * { box-sizing:border-box; }
    html {scroll-behavior:smooth}
    body {margin:0; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.58}
    a {color:#334f8e;text-underline-offset:3px} a:hover {color:#1c315e}
    button,textarea,input {font:inherit} button {cursor:pointer}
    button:disabled {opacity:.5;cursor:not-allowed}
    button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible {outline:3px solid #8757d7;outline-offset:3px}
    .shell {display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
    .sidebar {background:var(--navy);color:#e7ecf5;min-height:100vh;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 20px;overflow-y:auto}
    .logo {display:flex;gap:12px;align-items:center;color:white;text-decoration:none;margin-bottom:37px}
    .logo-mark {height:43px;width:43px;display:grid;place-items:center;background:var(--lime);color:var(--navy);font-size:24px;font-weight:1000;border-radius:14px;transform:rotate(-8deg);letter-spacing:-2px}
    .logo small {font-size:10px;letter-spacing:2.4px;display:block;text-transform:uppercase;color:#aab9d1;font-weight:800;line-height:1.5}
    .logo strong {display:block;line-height:1.1;font-size:19px;letter-spacing:-.75px}
    .navlabel {font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8f9bb4;font-weight:800;margin:19px 13px 8px}
    .navitem {display:flex;align-items:center;gap:10px;padding:10px 12px;color:#bac6d8;text-decoration:none;border-radius:11px;font-weight:650;font-size:14px;transition:.15s}
    .navitem:hover {background:#263149;color:#fff}
    .navitem.active {background:#2b3957;color:var(--lime)}
    .navicon {width:24px;text-align:center;font-size:17px}
    .navitem .number {font-size:11px;width:23px;height:23px;border:1px solid #56647c;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
    .navitem.complete .number {background:var(--lime);color:var(--navy);border-color:var(--lime)}
    .sidebar-bottom {margin-top:auto;padding:20px 12px 0}
    .sidebar-bottom .tiny {font-size:12px;color:#95a4be}
    .mini-progress {height:7px;background:#38435b;border-radius:9px;overflow:hidden;margin:10px 0}
    .mini-progress div {height:100%;background:var(--lime);border-radius:9px;transition:width .3s}
    .content {min-width:0}
    .topbar {height:77px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,68px);border-bottom:1px solid var(--line);background:#fdfdfb}
    .topbar .eyebrow {font-size:11px;color:#6c7890;letter-spacing:1.8px;text-transform:uppercase;font-weight:850}
    .topbar .tag {font-size:12px;color:#47566a;background:#ebefeb;padding:7px 11px;border-radius:100px;font-weight:750}
    main {max-width:1160px;margin:0 auto;padding:39px clamp(20px,5vw,68px) 90px}
    .eyebrow {text-transform:uppercase;letter-spacing:2.2px;font-size:12px;font-weight:850;color:#5b6b80}
    h1,h2,h3,h4,p {margin-top:0}
    h1 {font-size:clamp(42px,6vw,77px);letter-spacing:-3.4px;line-height:1.04;font-weight:900;margin-bottom:23px}
    h2 {font-size:clamp(28px,3.5vw,42px);letter-spacing:-1.5px;line-height:1.13;margin-bottom:17px}
    h3 {font-size:21px;letter-spacing:-.55px;line-height:1.28;margin-bottom:12px}
    p {margin-bottom:16px}
    .lead {font-size:clamp(17px,2vw,21px);line-height:1.6;color:#40516a;max-width:760px}
    .muted {color:var(--muted)} .small {font-size:13px} .fine {font-size:12px}
    .hero {display:grid;grid-template-columns:minmax(0,1.45fr) minmax(210px,1fr);background:var(--navy);color:#fff;overflow:hidden;border-radius:23px;min-height:355px;box-shadow:var(--shadow);margin:0 0 31px}
    .hero-copy {padding:40px clamp(25px,3.9vw,53px) 44px;position:relative;z-index:1}
    .hero h1 {font-size:clamp(43px,5.1vw,70px);margin:16px 0;color:var(--white)}
    .hero h1 span {color:var(--lime)}
    .hero .lead {color:#c4d0de;font-size:17px}
    .hero-art {position:relative;overflow:hidden;background:linear-gradient(135deg,#2c3563,#7f659e 48%,#ed8d78)}
    .hero-art:before {content:"";position:absolute;width:320px;height:320px;border-radius:55% 45% 70% 30%;background:var(--lime);left:-60px;top:75px;transform:rotate(28deg)}
    .hero-art:after {content:"";position:absolute;width:220px;height:320px;border-radius:100px 100px 20px 20px;border:32px solid #17213a;left:44%;top:12%;transform:rotate(-23deg);opacity:.78}
    .visual-orbit {width:210px;height:210px;position:absolute;border:19px solid #fff6;right:-49px;bottom:-64px;border-radius:50%}
    .art-text {position:absolute;bottom:22px;right:28px;font-size:13px;font-weight:900;letter-spacing:4px;color:#fff;z-index:1;transform:rotate(-10deg)}
    .btn {border:0;border-radius:12px;background:var(--navy);color:white;padding:12px 18px;font-weight:780;display:inline-flex;align-items:center;gap:9px;justify-content:center;text-decoration:none;line-height:1.25;transition:transform .13s,box-shadow .13s}
    .btn:hover {transform:translateY(-1px);box-shadow:0 5px 14px #17203825}
    .btn-light {background:var(--lime);color:var(--navy)}
    .btn-quiet {background:#ecefeb;color:var(--ink)}
    .btn-outline {background:white;color:var(--ink);border:1px solid #ccd1d7}
    .btn-small {font-size:13px;padding:9px 12px;border-radius:9px}
    .btn-row {display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .card {background:white;border:1px solid var(--line);border-radius:19px;padding:25px;box-shadow:0 3px 14px #26314a07}
    .grid-2 {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .grid-3 {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
    .section {margin:39px 0 18px}.section-head {display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}.section-head h2 {margin:0}
    .stat {padding:24px;background:#fff;border:1px solid var(--line);border-radius:17px}.stat strong {font-size:33px;letter-spacing:-1px;line-height:1.15;display:block}.stat span {color:var(--muted);font-size:13px;font-weight:700}
    .module {display:flex;align-items:flex-start;gap:17px;text-decoration:none;color:var(--ink);transition:transform .15s}
    .module:hover {transform:translateY(-2px);color:var(--ink)}
    .module .numberblock {min-width:51px;height:51px;border-radius:14px;background:#e9e3ff;color:#503c91;display:grid;place-items:center;font-size:19px;font-weight:900}
    .module:nth-child(4n+2) .numberblock {background:#fae4db;color:#a1443c}
    .module:nth-child(4n+3) .numberblock {background:#e8f6d0;color:#517327}
    .module:nth-child(4n+4) .numberblock {background:#dfeffc;color:#34678d}
    .module.complete .numberblock {background:#e1f4d2;color:#236739}
    .module h3 {font-size:18px;margin:0 0 5px}
    .module p {font-size:13px;color:#657186;margin:0}
    .module .chip {font-size:11px;background:#f1f3f0;border-radius:40px;padding:4px 8px;display:inline-block;margin-top:9px;font-weight:800;color:#5d6571}
    .detail-head {margin-bottom:33px}.detail-head h1 {font-size:clamp(40px,5.1vw,65px);max-width:820px;margin:12px 0 15px}
    .crumb {display:inline-flex;gap:8px;align-items:center;color:#657287;font-size:13px;font-weight:750;margin-bottom:15px}.crumb a {color:inherit}
    .pill {display:inline-flex;align-items:center;gap:6px;background:#e8e4fc;color:#4c3982;padding:6px 11px;border-radius:30px;font-weight:850;font-size:12px}
    .pill.teal {background:#ddf5e6;color:#246e4b}.pill.coral {background:#ffe9e2;color:#8f4540}
    .lesson-grid {display:grid;grid-template-columns:minmax(0,1fr) 253px;gap:24px;align-items:start}
    .story-card {background:white;padding:29px 30px;border:1px solid var(--line);border-radius:20px;margin-bottom:18px}
    .story-card p:last-child {margin-bottom:0}.story-card h3 {margin-bottom:12px}.story-card strong {color:#172038}
    .sidebar-note {position:sticky;top:25px;background:#e8f0e1;border-radius:18px;padding:21px;color:#344635}
    .sidebar-note b {display:block;margin:0 0 12px}.sidebar-note ul {padding-left:19px;font-size:13px;margin:0;line-height:1.8}
    .note {border-left:5px solid #bce460;background:#f0f7e4;padding:18px 20px;border-radius:0 12px 12px 0;margin:21px 0;color:#344b2c}
    .note.purple {border-color:#b49ce8;background:#f1eafb;color:#40315f}
    .activity {background:#ede6fe;border-radius:19px;padding:28px;margin:23px 0}
    .activity .eyebrow {color:#65498a}.activity p {max-width:730px}
    textarea,input[type=text] {background:#fff;color:var(--ink);width:100%;border:1px solid #ccd3d8;border-radius:12px;padding:15px 17px;resize:vertical;min-height:119px;line-height:1.5}
    input[type=text] {min-height:auto}
    .prompt-label {font-size:13px;color:#495970;font-weight:780;display:block;margin:13px 0 7px}
    .quiz {background:#fff;border:1px solid var(--line);border-radius:19px;padding:28px;margin:22px 0}
    .question {margin-bottom:25px;padding-bottom:23px;border-bottom:1px solid var(--line)}.question:last-of-type {border:none;padding:0;margin-bottom:15px}
    .question .q-title {font-weight:800;margin-bottom:12px}
    .choice {display:flex;gap:10px;align-items:flex-start;padding:11px 12px;margin:7px 0;border:1px solid #e0e4e7;border-radius:11px;cursor:pointer;font-size:14px}
    .choice:hover {background:#f9faf8}.choice input {margin:4px 3px 0 0;accent-color:#476347}.choice.correct {border-color:#74b28a;background:#ecf8ed}.choice.incorrect {border-color:#db9e8e;background:#fff1ec}
    .feedback {background:#edf4e9;border-radius:10px;padding:12px 14px;font-size:13px;color:#3e6244;margin:8px 0}.feedback.warn {background:#fff1e8;color:#8f4b2f}
    .muted-panel {background:#f5f6f3;border:1px solid var(--line);padding:19px 21px;border-radius:14px;margin:13px 0}
    .labchoices {display:grid;gap:10px;margin:20px 0}.labchoice {width:100%;text-align:left;padding:16px 19px;border:1px solid #dfe4e5;border-radius:13px;background:#fff;color:var(--ink);font-weight:690}
    .labchoice:hover {border-color:#a39ddc;background:#f8f6ff}.labchoice.selected {border:2px solid #7860c5;background:#f0eaff}
    .lab-panel {background:#fff;border-radius:20px;border:1px solid var(--line);padding:clamp(22px,3vw,35px);margin:20px 0}
    .scenario-num {font-size:12px;font-weight:850;color:#6c588f;letter-spacing:2px;text-transform:uppercase}
    .scenario-msg {background:#eff1f5;border-radius:16px;padding:21px 23px;font-size:18px;line-height:1.55;margin:21px 0;max-width:780px}
    .checkline {display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.checkline:last-child {border:0}.checkline input {appearance:none;width:21px;height:21px;border:2px solid #a6afbd;border-radius:7px;flex-shrink:0;margin-top:2px;position:relative}.checkline input:checked {border-color:#28705d;background:#28705d}.checkline input:checked:after {content:"✓";font-size:15px;font-weight:900;color:white;position:absolute;left:3px;top:-3px}
    .checkline strong {display:block;font-size:14px}.checkline span {font-size:13px;color:#6e798a}
    .platform-tabs {display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.platform-tab {border:1px solid #d8dcd9;background:white;border-radius:20px;padding:10px 17px;font-weight:800;font-size:13px;color:#37415a}.platform-tab.active {background:var(--navy);color:var(--lime);border-color:var(--navy)}
    .risk {background:#fff6ed;color:#8c4f32;border-radius:12px;padding:13px 17px;font-size:14px;margin:14px 0}
    .divider {border:0;border-top:1px solid var(--line);margin:27px 0}
    .resource {display:flex;gap:15px;align-items:start;text-decoration:none;color:var(--ink);padding:17px 0;border-bottom:1px solid var(--line)}.resource:hover strong {text-decoration:underline}.resource .resicon {height:41px;min-width:41px;border-radius:12px;background:#e6e0fb;display:grid;place-items:center}.resource strong {display:block}.resource span {font-size:13px;color:#657186}
    .agreement {background:#fff;border:1px solid var(--line);padding:26px;border-radius:18px}.agreement label {font-size:13px;font-weight:800;display:block;margin-bottom:7px}.agreement textarea {min-height:78px;margin-bottom:20px}
    .footer {font-size:12px;color:#738096;max-width:1000px;margin:45px auto 0;padding-top:20px;border-top:1px solid var(--line)}
    .toast {position:fixed;right:22px;bottom:21px;background:#17243c;color:white;border-radius:13px;padding:11px 16px;box-shadow:0 9px 35px #17203844;z-index:20;font-size:13px;font-weight:750;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}.toast.show {opacity:1;transform:none}
    .topnav-mobile {display:none}
    @media(max-width:1040px) {.shell {grid-template-columns:210px minmax(0,1fr)}.sidebar {padding:23px 12px}.logo {margin-left:6px}.lesson-grid{grid-template-columns:1fr}.sidebar-note {position:static}.hero {grid-template-columns:1.3fr .8fr}}
    @media(max-width:750px) {.shell {display:block}.sidebar {position:static;height:auto;min-height:auto;padding:12px 16px 9px;overflow:visible}.logo {margin:3px 0 9px}.logo-mark{height:36px;width:36px}.logo strong{font-size:16px}.sidebar .navlabel,.sidebar-bottom,.desktoplinks {display:none}.topnav-mobile {display:flex;gap:6px;overflow:auto;padding:4px 0 7px;scrollbar-width:thin}.topnav-mobile a {white-space:nowrap;color:#bec9d9;text-decoration:none;padding:7px 11px;background:#29344d;border-radius:8px;font-size:12px;font-weight:750}.topnav-mobile a.active{background:var(--lime);color:var(--navy)}.topbar {height:51px;padding:0 19px}.topbar .tag{font-size:10px}.hero{grid-template-columns:1fr;min-height:0}.hero-copy{padding:28px}.hero-art{height:110px}.hero-art:before{width:190px;height:190px;top:-40px;left:13%}.hero-art:after{width:160px;height:180px;top:-45px;left:55%}.hero h1{letter-spacing:-2px}.grid-2,.grid-3{grid-template-columns:1fr}.story-card,.quiz,.activity{padding:21px}.card{padding:20px}main{padding:25px 18px 60px}.section{margin:29px 0 14px}.detail-head h1{letter-spacing:-1.8px}.topbar .eyebrow{letter-spacing:1px;font-size:10px}}
    @media print {body {background:white}.sidebar,.topbar,.btn,.footer,.topnav-mobile {display:none!important}.shell{display:block}main{max-width:100%;padding:0}.card,.story-card,.quiz,.agreement{break-inside:avoid;box-shadow:none}.hero{color:black;background:white}.hero h1{color:black}.hero-art{display:none}}
  </style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* Creator Compass — fully local, no analytics, trackers, accounts, or uploads. */
const lessons = [
{ id:1, phase:'DISCOVER', duration:'20–30 min', title:'When you hit publish', subtitle:'What happens after a video leaves your phone?', why:'A public video can travel far beyond the people you imagined watching it.', sections:[
 ['Publishing is a handoff',`When you post a dance video publicly, you give other people the chance to watch, copy, screen-record, comment on, remix, or share it. A private account limits the audience, but someone who can see a post may still capture it. Deleting your original doesn't guarantee all copies disappear.`],
 ['The ripple effect',`Picture a dance clip posted on Friday. A friend shares it. Someone from another school sends a screen recording in a group chat. A fan account reposts a shortened version. Each action creates a new audience. Going viral can be exciting, uncomfortable, or both—and you may not control which part of your video travels.`],
 ['Future-you gets a vote',`Think beyond tonight's views. Would you be comfortable with a coach, teacher, future employer, or unfamiliar adult seeing the clip? That doesn't mean you must be perfect. It means publishing is a deliberate choice, not an automatic next step after filming.`]
 ], takeaway:'You can own your creative choices even when you cannot control every copy.', mission:'Describe three ways a public dance video might reach people you did not intend, and one reason you might decide not to post a video.', questions:[
 ['What changes when a video becomes public?',['Only your followers can copy it','Someone outside your intended audience may save or repost it','Deleting it will remove all copies'],1,'People can record or share public posts outside your account.'],
 ['A video gets reposted without permission. What is the most accurate statement?',['Deleting your original definitely deletes the repost','You can always stop all downloads','You can report misuse, but copies may remain'],2,'Reporting can help, but complete removal is not guaranteed.'],
 ['Which is a good pre-publish question?',['Will this get the most likes?','Would I be okay with an unexpected audience seeing this?','Did I post quickly enough?'],1,'Consider the audience and your comfort, not just performance.']
 ]},
{ id:2, phase:'DISCOVER', duration:'25–35 min', title:'Protect your real-world identity', subtitle:'The tiny clues that add up to a big picture.', why:'A stranger may learn a lot without you ever typing your address.', sections:[
 ['Privacy is a puzzle',`A studio logo on a wall, a school sweatshirt, a location tag, an event poster, and a repeated class time may each seem harmless. Together, they can reveal where you spend time and when. The same is true of reflections, street signs, windows, and background conversation.`],
 ['Separate public creator from private person',`Use a creative handle that doesn't include your full name, school, birthday, or location. A public bio can talk about dance styles and goals without saying where you train. Keep your personal friends account separate from any creator presence, and review what those accounts reveal about each other.`],
 ['Film like a detective',`Before you post, pause the video at random moments. Look behind you. Listen to the audio. Check captions, hashtags, and tags. Avoid filming around your home, your school, or recognizable everyday routes. Ask people in the background for permission—and remove identifiable clips when they say no.`]
 ], takeaway:'The safest personal detail is often the one you never publish.', mission:'Invent a fictional dance creator profile. Write a safe username, a two-sentence bio, and five things the profile should never reveal. Do not enter your own identifying information here.', questions:[
 ['Which set of details is most concerning?',['Dance style and a favorite song','Studio logo, regular class time, and school name','A neutral background and a stage name'],1,'Location and schedule clues can be combined.'],
 ['What makes a good creator username?',['Full legal name plus school','Street name and birth year','A memorable stage name without identifying details'],2,'Separate your public creative identity from private details.'],
 ['What should you check before uploading a dance video?',['Only the dance moves','Background, audio, captions, and location clues','Only whether it has enough hashtags'],1,'Clues appear in many places—not just your caption.']
 ]},
{ id:3, phase:'DEFEND', duration:'30–40 min', title:'Strangers, scams & manipulation', subtitle:'Recognize pressure before it becomes a problem.', why:'Manipulation often starts with friendliness, compliments, or a too-good-to-be-true offer.', sections:[
 ['Nice is not the same as safe',`A stranger may sound encouraging or claim to be a dancer, agent, photographer, or brand representative. Their profile, follower count, or professional-looking website does not verify their identity. Trust is earned through independently verifiable information—not praise.`],
 ['The warning-sign ladder',`Watch for requests to move a conversation to a private app, share your age or location, send a private photo or video, keep the conversation secret, or meet someone alone. These requests can arrive slowly, one small step at a time. Adults who want to work legitimately with minors should welcome appropriate guardian involvement.`],
 ["Boundaries don't need a debate",`You do not owe strangers replies, explanations, pictures, loyalty, or kindness at the expense of your safety. If something feels wrong, stop responding. Use platform blocking and reporting tools; if there is manipulation, sexual content, or threats, preserve safe evidence and bring a trusted adult into the situation.`]
 ], takeaway:'Attention is not trust, and secrecy is a warning sign.', mission:'Write a three-sentence response plan for a message offering a dance sponsorship and asking to switch to a private chat. Include how you would verify the opportunity with an adult.', questions:[
 ['A stranger says “Don’t tell your parents about this opportunity.” You should:',['Keep the opportunity secret','Stop and involve a trusted adult','Give them a chance to explain in private'],1,'Secrecy around minors is a serious warning sign.'],
 ['A large follower count proves an account is:',['Real and safe','Officially approved','Neither—identity must be verified independently'],2,'Follower numbers can be misleading or fake.'],
 ['If you are uncomfortable with a message, you:',['Must reply politely','Can stop engaging, block, report, and ask for help','Should share more information to clarify'],1,'You owe strangers no response.']
 ]},
{ id:4, phase:'DEFEND', duration:'25–35 min', title:'Your image. Your boundaries.', subtitle:'Sexualization, unauthorized edits & AI misuse.', why:'Your dancing is yours. Other people are responsible for how they treat it.', sections:[
 ['Dance is not an invitation',`Dancing, wearing a performance costume, or feeling proud of your appearance does not invite sexual comments. Unwanted remarks, requests for private content, or requests to alter a routine for someone's gratification are inappropriate. You do not need to defend your choices to strangers.`],
 ['Images can be misused',`People can crop, stitch, miscaption, or edit a clip, including with AI tools. Some manipulated images may falsely suggest something you never did. You can reduce exposure with careful sharing controls, but no platform promises complete protection from recording or misuse.`],
 ['Respond, don’t negotiate',`If someone sexualizes your content, do not argue with them. Use comment filters, block and report features, and tell a trusted adult. If someone threatens to circulate intimate imagery or demands images or money, do not comply or pay; get immediate help. Do not forward or download sexual images of minors while seeking assistance.`]
 ], takeaway:'It is never your responsibility to manage an adult stranger’s inappropriate behavior.', mission:'Write a plan for what you would do if a stranger made a sexual comment about an innocent dance clip or altered your video in a harmful way.', questions:[
 ['Who is responsible for an adult making a sexual comment about a teen dancer?',['The dancer for posting','The adult making the comment','The friends who watched the video'],1,'The person making inappropriate comments is responsible.'],
 ['Someone threatens to share a sexualized fake image of you. What first?',['Send money to make it stop','Keep it secret','Tell a trusted adult, stop engaging, and report the threat'],2,'You deserve help immediately; do not pay or comply.'],
 ['Disabling downloads means:',['Nobody can ever record your video','Some saving methods may be limited, but screen recording can still happen','All copies disappear'],1,'Settings reduce some risk; they do not eliminate it.']
 ]},
{ id:5, phase:'DEFEND', duration:'20–30 min', title:'Algorithms, likes & self-worth', subtitle:'Create for joy, not just numbers.', why:'Platforms are designed to hold attention; that does not make their metrics a fair score of you.', sections:[
 ['The number is not the meaning',`Views vary with timing, recommendations, trends, luck, and many factors you cannot control. A fantastic dance may reach ten people. A silly clip may reach thousands. Neither number measures your skill, character, body, or value.`],
 ['The pressure trap',`When attention feels rewarding, you may be tempted to post more often, imitate trends you dislike, or reveal more personal details. Notice when creating starts feeling like obligation. You can choose a posting schedule, take a break, and keep some dances just for yourself.`],
 ['Protect the art',`Choose goals that you can control: learning a move, making a thoughtful edit, trying a new style, collaborating with permission, or enjoying the process. Decide in advance how you’ll respond to harsh criticism and what boundaries will protect school, sleep, and relationships.`]
 ], takeaway:'A low-view video does not make you less of a dancer. A viral video does not make you more valuable.', mission:'Write three non-numerical creative goals. Then explain how you would respond if a video you loved received almost no attention.', questions:[

function renderLesson(l){const saved=state.choices[l.id]||{};const grade=state.scores[l.id];const reflection=state.reflections[l.id]||'';const next=lessons[l.id];const questions=l.questions.map((q,ix)=>`<div class="question"><div class="q-title">${ix+1}. ${esc(q[0])}</div>${q[1].map((opt,i)=>{let cl='';if(grade&&i===q[2])cl='correct';else if(grade&&saved[ix]===i&&i!==q[2])cl='incorrect';return `<label class="choice ${cl}"><input type="radio" name="q${ix}" data-lesson="${l.id}" data-question="${ix}" value="${i}" ${saved[ix]===i?'checked':''}><span>${esc(opt)}</span></label>`}).join('')}${grade?`<div class="feedback ${saved[ix]===q[2]?'':'warn'}"><b>${saved[ix]===q[2]?'Correct.':'Try a different answer.'}</b> ${esc(q[3])}</div>`:''}</div>`).join('');return `<div class="detail-head"><div class="crumb"><a href="#home">Dashboard</a> / Lesson ${l.id} of 8</div><div class="eyebrow">${l.phase} • ${l.duration}</div><h1>${esc(l.title)}</h1><p class="lead">${esc(l.subtitle)}</p><span class="pill ${state.done.includes(l.id)?'teal':''}">${state.done.includes(l.id)?'✓ Lesson completed':'✧ Your next skill'}</span></div><div class="lesson-grid"><div><div class="story-card"><span class="eyebrow">WHY IT MATTERS</span><h2 style="margin-top:12px;font-size:29px">${esc(l.why)}</h2><p class="muted small">Read each section, then complete your personal reflection and knowledge check.</p></div>${l.sections.map(([title,txt],i)=>`<article class="story-card"><div class="eyebrow">0${i+1} / LEARN</div><h3 style="margin-top:10px">${esc(title)}</h3><p>${esc(txt)}</p></article>`).join('')}<div class="note purple"><b>Worth remembering:</b> ${esc(l.takeaway)}</div><div class="activity"><div class="eyebrow">YOUR MISSION / SHORT RESPONSE</div><h3 style="margin-top:10px">Put it into your own words</h3><p>${esc(l.mission)}</p><label for="reflection-${l.id}" class="prompt-label">Your response (at least 40 characters; no real names, addresses, or contact details)</label><textarea id="reflection-${l.id}" data-reflection="${l.id}" placeholder="I think I would...">${esc(reflection)}</textarea><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="small muted">Auto-saved on this device.</span><span class="small muted" id="response-count">${reflection.trim().length} characters</span></div></div><div class="quiz"><span class="eyebrow">KNOWLEDGE CHECK</span><h3 style="margin-top:10px">Show what you know</h3><p class="muted small">Three questions. Choose an answer for each, then check. You need 2 correct answers to complete this lesson.</p>${questions}<div class="btn-row"><button class="btn" data-action="grade" data-id="${l.id}">Check answers</button>${grade?`<span class="pill ${grade.score>=2?'teal':'coral'}">${grade.score} / 3 correct</span>`:''}</div></div><div class="card" style="background:#eaf1e2"><h3>${state.done.includes(l.id)?'This lesson is complete ✓':'Ready to finish?'}</h3><p class="small">${state.done.includes(l.id)?'You can revisit your reflection, but your completion stays saved.':`Finish your reflection and pass the quiz. Then save your completion.`}</p><div class="btn-row"><button class="btn ${state.done.includes(l.id)?'btn-outline':'btn-light'}" data-action="finish-lesson" data-id="${l.id}">${state.done.includes(l.id)?'Save updates':'Complete lesson ✓'}</button>${next?`<a class="btn btn-outline" href="#lesson-${next.id}">Next lesson →</a>`:`<a class="btn btn-outline" href="#final">Final project →</a>`}</div></div></div><aside><div class="sidebar-note"><b>Creator mindset</b><p class="small">Strong creators practice judgment, not perfection.</p><ul><li>Read with curiosity.</li><li>Answer honestly.</li><li>Bring confusing moments to a trusted adult.</li><li>There is no need to publish anything during the course.</li></ul><hr class="divider"><span class="small">Lessons complete: <b>${state.done.length} / 8</b></span><div class="mini-progress" style="background:#c9d6c5"><div style="background:#457b52;width:${pct()}%"></div></div></div></aside></div>`}
function renderLab(){const i=Math.min(Math.max(0,state.labIndex),scenarios.length-1),s=scenarios[i],ans=state.scenarios[i];return `<div class="detail-head"><div class="eyebrow">REAL-WORLD PRACTICE</div><h1>The Safety Lab.</h1><p class="lead">The internet doesn't give you multiple-choice questions. Here, you get a chance to practice before a difficult situation happens.</p><span class="pill">${Object.keys(state.scenarios).length} / ${scenarios.length} scenarios explored</span></div><div class="lab-panel"><div class="scenario-num">SCENARIO ${i+1} OF ${scenarios.length}</div><h2 style="margin-top:9px">${esc(s.title)}</h2><div class="scenario-msg">“${esc(s.message)}”</div><h3>What would you do?</h3><div class="labchoices">${s.options.map((opt,j)=>`<button class="labchoice ${ans===j?'selected':''}" data-action="scenario-answer" data-index="${i}" data-choice="${j}"><b>${String.fromCharCode(65+j)}.</b> ${esc(opt)}</button>`).join('')}</div>${ans!==undefined?`<div class="feedback ${ans===s.correct?'':'warn'}"><b>${ans===s.correct?'Strong choice.':'A better approach is option '+String.fromCharCode(65+s.correct)+'.'}</b><p style="margin:7px 0 0">${esc(s.why)}</p></div>`:''}<hr class="divider"><div class="btn-row" style="justify-content:space-between"><button class="btn btn-outline" data-action="scenario-prev" ${i===0?'disabled':''}>← Previous</button><button class="btn btn-light" data-action="scenario-next">${i===scenarios.length-1?'Restart lab ↻':'Next situation →'}</button></div></div><div class="note"><b>Learning rule:</b> Sometimes an answer that seems polite is unsafe. You do not have to be polite to someone who crosses your boundaries.</div><p class="muted small">All scenarios are fictional. If something like this is happening in real life, involve a trusted adult promptly.</p>`}
function renderAudit(){const p=platformData[state.platform]||platformData[0];const checked=state.platformChecks[p.name]||[];const total=platformData.reduce((a,it)=>a+(state.platformChecks[it.name]||[]).length,0);return `<div class="detail-head"><div class="eyebrow">RESEARCH & COMPARE</div><h1>Know your platforms.</h1><p class="lead">Every app has different features, and safety settings change. Your mission is to learn how to investigate them—not to memorize screenshots that may become outdated.</p></div><div class="note"><b>Important:</b> Use your real age. Never create an adult account to bypass protections. Snapchat Public Profiles generally start at age 16; the platform may not be an option for public posting yet.</div><div class="card"><div class="eyebrow">PLATFORM EXPLORER</div><div class="platform-tabs">${platformData.map((it,i)=>`<button class="platform-tab ${state.platform===i?'active':''}" data-action="platform" data-index="${i}">${it.name}</button>`).join('')}</div><h2 style="font-size:31px">${p.name}</h2><p>${esc(p.short)}</p><a href="${p.url}" target="_blank" rel="noopener noreferrer" class="btn btn-small btn-outline">Read official platform guidance ↗</a><p class="muted small" style="margin-top:12px">This snapshot was reviewed in November 2026. Always recheck before creating or changing an account.</p><hr class="divider"><h3>Investigation checklist <span class="muted small">${checked.length} / ${p.checks.length}</span></h3>${p.checks.map((item,i)=>`<label class="checkline"><input type="checkbox" data-platform-check="${p.name}" value="${i}" ${checked.includes(i)?'checked':''}><span><strong>${esc(item)}</strong><span>Find the current rule in the app or its official help center.</span></span></label>`).join('')}</div><div class="section"><div class="card" style="background:#e9e5fa"><h3>Your research progress</h3><p class="muted small">${total} of 24 investigation items checked across four platforms. Researching a platform does not mean you are allowed to make a public account on it.</p><button class="btn btn-outline btn-small" data-action="export">Save a backup of your work</button></div></div>`}
function renderFinal(){const allDone=state.done.length===8;const portfolio=state.portfolio.length===5;const ag=state.agreement;const fields=[['purpose','Why I want to share my dance videos'],['identity','My public profile and identity boundaries'],['posting','Our filming locations, approval process, and posting schedule'],['interactions','Rules for comments, DMs, strangers, and offers'],['wellbeing','My screen-time, school, sleep, and mental-health boundaries'],['emergency','My plan if something goes wrong'],['review','When we will review or pause the trial']];return `<div class="detail-head"><div class="eyebrow">THE CREATOR PORTFOLIO</div><h1>Show you're ready to lead.</h1><p class="lead">Finishing a course is only the start. Your final project is a conversation about your judgment, goals, and boundaries with a parent—not a pass that unlocks public social media automatically.</p></div><div class="grid-3"><div class="stat"><strong>${state.done.length}/8</strong><span>Lessons</span></div><div class="stat"><strong>${Object.keys(state.scenarios).length}/6</strong><span>Practice scenarios</span></div><div class="stat"><strong>${state.portfolio.length}/5</strong><span>Portfolio milestones</span></div></div><div class="section"><h2>01 / Creator portfolio</h2></div><div class="card">${portfolioItems.map(([title,desc],i)=>`<label class="checkline"><input type="checkbox" data-portfolio="${i}" ${state.portfolio.includes(i)?'checked':''}><span><strong>${esc(title)}</strong><span>${esc(desc)}</span></span></label>`).join('')}</div><div class="section"><h2>02 / The pre-publish review</h2><p class="muted">Use this checklist on each of your three private practice videos. This is a review guide, not an automatic risk detector—no video uploads are required.</p></div><div class="card">${auditChecklist.map((item,i)=>`<label class="checkline"><input type="checkbox" data-video-check="${i}" ${state.videoChecks.includes(i)?'checked':''}><span><strong>${esc(item)}</strong></span></label>`).join('')}<div class="muted-panel"><b>${state.videoChecks.length}/${auditChecklist.length} checks reviewed</b><p class="small muted" style="margin:5px 0 0">${state.videoChecks.length===auditChecklist.length?'Review complete for this practice video. A trusted adult should still review it before any public posting.':'Review every item; if something is unclear, edit or reshoot before posting.'}</p><button class="btn btn-small btn-outline" style="margin-top:12px" data-action="video-reset">Reset for next video</button></div></div><div class="section"><h2>03 / Our family creator agreement</h2><p class="muted">Draft your proposed boundaries. Your parent can discuss and revise them with you. Avoid typing sensitive contact details here.</p></div><div class="agreement">${fields.map(([key,label])=>`<label for="ag-${key}">${label}</label><textarea id="ag-${key}" data-agreement="${key}" placeholder="My proposal is...">${esc(ag[key]||'')}</textarea>`).join('')}<div class="btn-row"><button class="btn" data-action="print">Print / save as PDF</button><button class="btn btn-outline" data-action="export">Export course data</button></div></div><div class="section"><div class="card" style="background:${allDone&&portfolio?'#e5f5db':'#e9e6fa'}"><div class="eyebrow">FAMILY READINESS CONVERSATION</div><h2 style="margin-top:10px">${allDone&&portfolio?'Ready to review together.':'Learning first. Conversation next.'}</h2><p>${allDone&&portfolio?'You have checked the learning and portfolio milestones. Sit down together, discuss the agreement and actual platform rules, and decide whether a time-limited supervised trial is appropriate.':'Finish all eight lessons and five portfolio milestones before your final review. A parent should review the substance—not just the check marks.'}</p><a class="btn btn-outline btn-small" href="#parent">Open parent guide ↗</a></div></div>`}
function renderParent(){return `<div class="detail-head"><div class="eyebrow">FOR PARENTS / GUARDIANS</div><h1>Coach the judgment.<br>Keep the connection.</h1><p class="lead">This course is designed to be completed by a teen with meaningful, calm adult participation. It doesn't make public posting risk-free.</p></div><div class="grid-2"><div class="card"><span class="pill">THE APPROACH</span><h3 style="margin-top:17px">Curiosity before control</h3><p>Ask what she loves about dancing and what she hopes sharing will feel like. Explore potential benefits honestly, then make the risks discussable. She should never need to hide a frightening experience to avoid losing your trust.</p></div><div class="card"><span class="pill coral">THE LIMIT</span><h3 style="margin-top:17px">Completion ≠ permission</h3><p>Even after finishing, the two of you may decide to wait, try private sharing, or approve one age-permitted platform with strict boundaries. Revisit the agreement as her maturity and the platforms change.</p></div></div><div class="section"><h2>How to facilitate</h2></div><div class="card"><div class="grid-2"><div><h3>Each week</h3><p class="small">Aim for 1–2 lessons. Let her read, answer, and write first. Then spend 15–20 minutes discussing situations without trying to catch her out.</p></div><div><h3>In the final review</h3><p class="small">Ask her to explain a privacy risk in one of her videos, demonstrate an app setting, identify manipulation tactics, and walk you through the emergency plan.</p></div><div><h3>What to evaluate</h3><p class="small">Look for specific reasoning, willingness to ask for help, respect for others' consent, and ability to recognize risky tradeoffs. A perfect quiz score matters less than a thoughtful explanation.</p></div><div><h3>Agree on support</h3><p class="small">Make help-seeking nonpunitive. Safety comes first if she reports harassment, exploitation, or embarrassing mistakes; any later discussion of rules should be separate and measured.</p></div></div></div><div class="section"><h2>Suggested trial boundaries</h2></div><div class="card">${[['One platform first','Limit the initial trial to a single age-permitted platform; expand only after a review.'],['No public livestreaming','Start with pre-recorded, reviewed content; follow platform age restrictions.'],['No stranger conversations','Restrict DMs and contact options to the greatest extent allowed. No secret deals or meetups.'],['Video approval period','Review all videos together before posting for the first 30 days.'],['No real-world identifiers','Avoid school, studio schedule, home area, and recurring location clues.'],['Weekly check-in','Discuss comments, mood, pressure, enjoyment, and any uncomfortable interactions.'],['Clear off-ramp','Pause or change the plan if safety, sleep, school, or well-being suffers.']].map(([a,b])=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${a}</b><p class="muted small" style="margin:2px 0">${b}</p></div>`).join('')}</div><div class="section"><h2>Discussion prompts</h2></div><div class="card"><ol><li>Which lesson changed your mind about something?</li><li>How would you notice if views were starting to control your choices?</li><li>What kinds of comments would you want help dealing with?</li><li>If you made a mistake, what would make it easier to tell me?</li><li>What would feel like fair and respectful parental oversight?</li><li>What would make you decide to pause posting?</li></ol></div><div class="note"><b>In a crisis:</b> Prioritize reassurance and real-world safety. For threats, blackmail, or suspected child exploitation, involve a trusted adult immediately, use platform reporting tools, and consult NCMEC's CyberTipline. Do not forward sexual images of minors to document an incident.</div>`}
function renderResources(){return `<div class="detail-head"><div class="eyebrow">LEARN MORE / GET HELP</div><h1>Good sources.<br>Better decisions.</h1><p class="lead">Use official guidance for fast-changing features and recognized safety organizations for practical support. These links open outside the course.</p></div><div class="card">${resources.map(([name,desc,url,icon])=>`<a class="resource" href="${esc(url)}" target="_blank" rel="noopener noreferrer"><span class="resicon">${esc(icon)}</span><span><strong>${esc(name)} ↗</strong><span>${esc(desc)}</span></span></a>`).join('')}</div><div class="risk"><strong>Urgent situations:</strong> If someone is in immediate danger, contact emergency services. If a young person is facing sexual exploitation or sextortion, contact a trusted adult and consult the CyberTipline. Do not attempt to handle threats alone.</div>`}
function exportState(){const blob=new Blob([JSON.stringify({app:'Creator Compass',version:1,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='creator-compass-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Progress backup downloaded')}
function toggleArray(key,val,on){const set=new Set(state[key]||[]);on?set.add(val):set.delete(val);state[key]=[...set];persist()}
function navigate(){renderShell();window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('hashchange',navigate);
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-question]')){const lesson=Number(el.dataset.lesson),q=el.dataset.question;state.choices[lesson]??={};state.choices[lesson][q]=Number(el.value);delete state.scores[lesson];persist();}else if(el.matches('[data-portfolio]')){toggleArray('portfolio',Number(el.dataset.portfolio),el.checked);renderShell()}else if(el.matches('[data-video-check]')){toggleArray('videoChecks',Number(el.dataset.videoCheck),el.checked);renderShell()}else if(el.matches('[data-platform-check]')){const name=el.dataset.platformCheck;const set=new Set(state.platformChecks[name]||[]);el.checked?set.add(Number(el.value)):set.delete(Number(el.value));state.platformChecks[name]=[...set];persist();renderShell()}else if(el.id==='import-file'&&el.files?.[0]){const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=='Creator Compass'||obj.version!==1||!obj.data)throw new Error('Not a Creator Compass backup');state={...structuredClone(initialState),...obj.data};persist();renderShell();toast('Progress imported')}catch(err){alert('Could not import: '+err.message)}};reader.readAsText(el.files[0]);}});
document.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-reflection]')){state.reflections[el.dataset.reflection]=el.value;persist();const count=document.getElementById('response-count');if(count)count.textContent=el.value.trim().length+' characters'}else if(el.matches('[data-agreement]')){state.agreement[el.dataset.agreement]=el.value;persist()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
if(a==='grade'){const id=Number(el.dataset.id),l=lessons[id-1],saved=state.choices[id]||{};if(l.questions.some((_,i)=>saved[i]===undefined)){toast('Answer all three questions first');return;}const score=l.questions.reduce((n,q,i)=>n+(saved[i]===q[2]?1:0),0);state.scores[id]={score};persist();renderShell();toast(score>=2?'Knowledge check passed':'Review the explanations and try again')}
if(a==='finish-lesson'){const id=Number(el.dataset.id),l=lessons[id-1],text=String(state.reflections[id]||'').trim();if(text.length<40){toast('Add at least 40 characters to your reflection');document.querySelector('[data-reflection]')?.focus();return}if((state.scores[id]?.score||0)<2){toast('Pass the knowledge check (2 of 3) first');return}if(!state.done.includes(id))state.done.push(id);state.done.sort((x,y)=>x-y);persist();renderShell();toast('Lesson completed!')}
if(a==='scenario-answer'){state.scenarios[Number(el.dataset.index)]=Number(el.dataset.choice);persist();renderShell()}
if(a==='scenario-next'){state.labIndex=(state.labIndex+1)%scenarios.length;persist();renderShell()}
if(a==='scenario-prev'){state.labIndex=Math.max(0,state.labIndex-1);persist();renderShell()}
if(a==='platform'){state.platform=Number(el.dataset.index);persist();renderShell()}
if(a==='video-reset'){state.videoChecks=[];persist();renderShell();toast('Checklist reset for the next video')}
if(a==='print')window.print();
if(a==='export')exportState();
if(a==='import')document.getElementById('import-file')?.click();
});
if(!location.hash)location.hash='#home';renderShell();
</script>
